<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated hearts background */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: float 6s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #d63384;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .video-container {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            background: #f8f9fa;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .confession-text {
            background: linear-gradient(135deg, #ffeef8, #fff5f7);
            padding: 30px;
            border-radius: 20px;
            border-left: 5px solid #d63384;
            margin-top: 20px;
        }

        .confession-text h2 {
            color: #d63384;
            font-size: 1.8em;
            margin-bottom: 20px;
            text-align: center;
        }

        .confession-display {
            font-size: 1.2em;
            line-height: 1.8;
            color: #555;
            text-align: center;
            font-style: italic;
            padding: 20px;
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .card {
                padding: 25px;
            }

            .video-container {
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div class="card">
            <h1>💕 Сен үшін 💕</h1>
            
            <div class="video-container" id="videoContainer">
                <video id="video" controls>
                    <source src="KDLGE0288.mp4" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>

            <div class="confession-text">
                <h2>💌 Менің айтарым 💌</h2>
                <!-- ИЗМЕНИТЕ ТЕКСТ НИЖЕ НА СВОЕ ПРИЗНАНИЕ -->
                <div class="confession-display">
                    Саған мен үшін қаншалықты маңызды екеніңді айтқым келеді...

Сенімен өткен әрбір күн — мен үшін ерекше сыйлық. Сенің жанында болу — бақыт!

Мен сені жақсы көремін! ❤️
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 800);
    </script>
</body>

</html>
